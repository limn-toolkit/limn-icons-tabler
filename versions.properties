# The version the NEXT release carries — the single place it is written.
#
# Two readers of one file: build.gradle.kts turns it into the default (-SNAPSHOT) version, and
# the tag-releases workflow turns it into the tag `v<version>` on every push to main, creating
# and publishing it if it does not exist yet. Releasing is: bump this (with VERSION and the
# SHA-256 in scripts/generate-tabler-icons.py, if Tabler moved; run the generator; commit),
# push. Nobody types or pushes a tag.
#
# The scheme: the first three components ARE the Tabler release the generator pins (the build
# refuses a mismatch), and the fourth is this repository's own — a change to the hand-written
# classes, or a rebuild against a newer toolkit, spends it. 3.46.0.0 is Tabler 3.46.0 as first
# packaged here; 3.46.0.1 the same icons with a change of ours; 3.47.0.0 the next Tabler.
limn-icons-tabler=3.46.0.0
