# Publishes the icon pack to Maven Central, off a tag, and drafts the GitHub release.
#
# The version comes from the tag and from nowhere else: build.gradle.kts reads -PlimnIconsVersion
# and otherwise says -SNAPSHOT. The tag itself is made by the tag-releases workflow from
# versions.properties; nobody types it. Neither half of a release publishes itself: the upload
# STOPS at the Portal as a staged deployment, and the GitHub release is created as a DRAFT.
#
# Secrets (repository settings → Secrets and variables → Actions), the same four as limn-toolkit:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD   the Portal USER TOKEN, not the login
#   SIGNING_KEY                                       `gpg --armor --export-secret-keys <id>`
#   SIGNING_PASSWORD                                  that key's passphrase

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v. Blank takes versions.properties."
        required: false
        type: string
      force:
        description: "Upload again even though this version was already uploaded once"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="$(sed -n 's/^limn-icons-tabler[[:space:]]*=[[:space:]]*//p' versions.properties | tr -d '[:space:]')"
              echo "version left blank; versions.properties says $VERSION"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$'; then
            echo "::error::'$VERSION' is not a release version (expected <tabler>.<n>, e.g. 3.46.0.0)"
            exit 1
          fi
          PIN="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' scripts/generate-tabler-icons.py)"
          case "$VERSION" in
            "$PIN".*) ;;
            *) echo "::error::$VERSION does not name the Tabler the generator pins ($PIN)"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing limn-icons-tabler $VERSION (Tabler $PIN)"

      - name: Verify the tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::$TAG does not exist. A push to main with the bumped versions.properties creates it."
            exit 1
          fi
          TAGGED="$(git rev-parse "$TAG^{commit}")"
          if [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $TAGGED, not at the commit being built ($GITHUB_SHA)"
            exit 1
          fi
          echo "$TAG is $TAGGED"

      - name: Refuse a second upload of the same version
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          PRIOR="$(gh run list --workflow publish.yml --branch "$TAG" --status success \
                     --limit 20 --json url --jq '.[0].url // empty')"
          if [ -n "$PRIOR" ]; then
            echo "::error::$TAG has already been uploaded, by $PRIOR. Nothing was sent this time."
            exit 1
          fi
          echo "no successful publish run for $TAG yet"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The whole gate before the upload: compile, tests, Javadoc, and the regeneration diff.
      - name: Gradle check
        run: ./gradlew check -PlimnIconsVersion=${{ needs.verify.outputs.version }}

      # Publish to a file repository, resolve from it as a target-17 consumer, compile against it
      # and draw from it — before anything leaves, because Central keeps what it accepts.
      - name: Rehearse the consumer
        run: bash scripts/rehearse-consumer.sh ${{ needs.verify.outputs.version }}

      - name: Publish to Maven Central
        run: >-
          ./gradlew publishToMavenCentral
          -PlimnIconsVersion=${{ needs.verify.outputs.version }}
          --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  draft-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a release already exists for $TAG; leaving it untouched"
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --title "limn-icons-tabler $VERSION" \
            --generate-notes \
            --notes "$(cat <<NOTES
          Published to Maven Central as \`io.github.limn-toolkit:limn-icons-tabler:$VERSION\`
          — Tabler Icons ${VERSION%.*}, versioned with Tabler rather than with the toolkit.

          An application opts in. The pack is compiled against the published \`limn-toolkit\`
          and names no toolkit version of its own: the one your \`limn-backend-lwjgl\` line
          brings is the one it runs on.

          Gradle:

          \`\`\`kotlin
          dependencies {
              implementation("io.github.limn-toolkit:limn-icons-tabler:$VERSION")
          }
          \`\`\`

          Maven:

          \`\`\`xml
          <dependency>
            <groupId>io.github.limn-toolkit</groupId>
            <artifactId>limn-icons-tabler</artifactId>
            <version>$VERSION</version>
          </dependency>
          \`\`\`

          \`\`\`java
          Icon save = TablerDevices.DEVICE_FLOPPY.icon();
          \`\`\`

          The Java is Apache 2.0; the drawings are Tabler's under MIT, with the licence text in
          the jar. The pack was regenerated from the pinned upstream tarball and diffed, compiled
          and tested against the toolkit, and resolved by a target-17 consumer before upload.

          ---
          NOTES
          )"
          echo "### Drafted $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. The deployment on <https://central.sonatype.com/publishing/deployments> — inspect it, then **Publish** (or **Drop**)." >> "$GITHUB_STEP_SUMMARY"
          echo "2. The draft release on <https://github.com/$GH_REPO/releases> — edit the notes, then publish it." >> "$GITHUB_STEP_SUMMARY"
