[versions]
central-publish = "0.37.0"
# The toolkit this pack is compiled against: the PUBLISHED one, from Maven Central. The pack
# touches two of its types (limn.graphics.Icon, limn.graphics.SvgIcon) and one call, so this
# moves rarely; when it does, the fourth component of versions.properties moves with it.
limn-toolkit = "0.5.0"
junit = "6.1.1"

[libraries]
limn-toolkit = { module = "io.github.limn-toolkit:limn-toolkit", version.ref = "limn-toolkit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
# Maven Central's own upload API takes a signed bundle, which `maven-publish` alone cannot
# produce: this plugin turns each module's publication into that bundle, signs every artifact
# in it, and hands it to the Central Portal. Same plugin, same version, as limn-toolkit uses.
central-publish = { id = "com.vanniktech.maven.publish", version.ref = "central-publish" }
